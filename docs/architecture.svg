<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 972 304" width="972" height="304" role="img" aria-label="Browser to Next.js on Vercel, which forwards /api to Django on Railway. Django reads PostgreSQL on Supabase and queues jobs in Redis. A Celery worker calls Gemini and Google Places and saves places to PostgreSQL. Live updates stream back to the browser over Server-Sent Events.">
  <!-- Static copy of the architecture diagram on /how-it-works (frontend/app/how-it-works/page.tsx). -->
  <style>
    .bx { fill: #f8faf9; stroke: #dbe1e4; stroke-width: 1.5; }
    .bx.ai { stroke: #2443d0; }
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .bt { fill: #15212b; font-size: 14px; font-weight: 600; }
    .bs { fill: #59666f; font-size: 12px; }
    .ar { stroke: #8a969e; stroke-width: 1.5; fill: none; }
    .ah { fill: #8a969e; }
    .sse { stroke: #2443d0; stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; }
    .ahs { fill: #2443d0; }
    .al { fill: #59666f; font-size: 11.5px; font-weight: 500; }
    .al.acc { fill: #2443d0; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
    <marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahs" d="M0 0L10 5L0 10z"/></marker>
  </defs>
  <rect x="0.75" y="0.75" width="970.5" height="302.5" rx="14" fill="#ffffff" stroke="#dbe1e4" stroke-width="1.5"/>
  <g transform="translate(16 16)">
    <path class="sse" d="M520 40 C520 6 85 6 85 38" marker-end="url(#ahs)"/>
    <text class="al acc" x="302" y="31" text-anchor="middle">live updates (Server-Sent Events)</text>

    <rect class="bx" x="10" y="44" width="150" height="54" rx="10"/>
    <text class="bt" x="85" y="67" text-anchor="middle">Your browser</text>
    <text class="bs" x="85" y="85" text-anchor="middle">any device</text>

    <rect class="bx" x="215" y="44" width="165" height="54" rx="10"/>
    <text class="bt" x="297.5" y="67" text-anchor="middle">Vercel</text>
    <text class="bs" x="297.5" y="85" text-anchor="middle">Next.js site · HTTPS</text>

    <rect class="bx" x="435" y="44" width="170" height="54" rx="10"/>
    <text class="bt" x="520" y="67" text-anchor="middle">Railway: Django</text>
    <text class="bs" x="520" y="85" text-anchor="middle">REST API · Swagger</text>

    <rect class="bx" x="765" y="44" width="160" height="54" rx="10"/>
    <text class="bt" x="845" y="67" text-anchor="middle">PostgreSQL</text>
    <text class="bs" x="845" y="85" text-anchor="middle">Supabase</text>

    <rect class="bx" x="435" y="178" width="150" height="54" rx="10"/>
    <text class="bt" x="510" y="201" text-anchor="middle">Redis</text>
    <text class="bs" x="510" y="219" text-anchor="middle">job queue · limits</text>

    <rect class="bx ai" x="615" y="178" width="150" height="54" rx="10"/>
    <text class="bt" x="690" y="201" text-anchor="middle">Celery worker</text>
    <text class="bs" x="690" y="219" text-anchor="middle">maps one video</text>

    <rect class="bx ai" x="795" y="148" width="130" height="54" rx="10"/>
    <text class="bt" x="860" y="171" text-anchor="middle">Gemini</text>
    <text class="bs" x="860" y="189" text-anchor="middle">watches the vlog</text>

    <rect class="bx ai" x="795" y="214" width="130" height="54" rx="10"/>
    <text class="bt" x="860" y="237" text-anchor="middle">Google Places</text>
    <text class="bs" x="860" y="255" text-anchor="middle">checks each spot</text>

    <line class="ar" x1="160" y1="71" x2="212" y2="71" marker-end="url(#ah)"/>
    <text class="al" x="407" y="62" text-anchor="middle">/api</text>
    <line class="ar" x1="380" y1="71" x2="432" y2="71" marker-end="url(#ah)"/>
    <line class="ar" x1="605" y1="71" x2="762" y2="71" marker-end="url(#ah)"/>
    <text class="al" x="684" y="62" text-anchor="middle">reads trips</text>
    <line class="ar" x1="520" y1="98" x2="520" y2="175" marker-end="url(#ah)"/>
    <text class="al" x="528" y="141">queues a job</text>
    <line class="ar" x1="585" y1="205" x2="612" y2="205" marker-end="url(#ah)"/>
    <line class="ar" x1="765" y1="196" x2="792" y2="176" marker-end="url(#ah)"/>
    <line class="ar" x1="765" y1="214" x2="792" y2="238" marker-end="url(#ah)"/>
    <line class="ar" x1="706" y1="176" x2="815" y2="100" marker-end="url(#ah)"/>
    <text class="al" x="742" y="128" text-anchor="end">saves places</text>
  </g>
</svg>

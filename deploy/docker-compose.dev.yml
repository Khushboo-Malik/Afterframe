# Local dev services for AfterFrame.
# `name: afterframe` prefixes every container/network/volume with "afterframe",
# so nothing collides with work containers on this shared Docker Desktop.
# Non-default host ports (55432, 56379) avoid clashing with work Postgres/Redis.
#
#   docker compose -f deploy/docker-compose.dev.yml up -d
#   docker compose -f deploy/docker-compose.dev.yml down      # this project only
#
# Never run `docker system prune` / `docker volume prune` on this machine.
name: afterframe

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: afterframe
      POSTGRES_PASSWORD: afterframe
      POSTGRES_DB: afterframe
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - afterframe-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afterframe -d afterframe"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - afterframe-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  afterframe-pg:
    name: afterframe-pg
  afterframe-redis:
    name: afterframe-redis

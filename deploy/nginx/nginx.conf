# Nginx in front of Django (gunicorn + uvicorn) on the EC2 server.
# Browser -> Vercel (HTTPS) -> this Nginx on :80 -> web:8000.
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # No visitor IPs in the logs: the project stores no IP addresses anywhere.
    log_format noip '$time_iso8601 "$request" $status $body_bytes_sent ${request_time}s';
    access_log /dev/stdout noip;
    error_log /dev/stderr warn;

    server_tokens off;
    client_max_body_size 1m;

    upstream django {
        server web:8000;
        keepalive 8;
    }

    server {
        listen 80 default_server;

        # Every proxied request. Locations below add to these without
        # redefining proxy_set_header, so they inherit all of it.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Vercel sends "<client>"; this appends Vercel's IP, so Django sees
        # "<client>, <vercel>" and DRF (NUM_PROXIES=2) throttles the real visitor.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;

        # Live updates (SSE): pass every event through the moment it's written.
        # Django ends each stream after 25s and the browser reconnects.
        location ~ ^/api/videos/[^/]+/events$ {
            proxy_pass http://django;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 60s;
        }

        location / {
            proxy_pass http://django;
        }
    }
}

# Production stack on the EC2 server, run from /opt/afterframe as root (`sudo -i`):
#
#   docker compose -f deploy/docker-compose.prod.yml pull
#   docker compose -f deploy/docker-compose.prod.yml up -d
#   docker compose -f deploy/docker-compose.prod.yml logs -f web worker
#
# Two files on the server, both gitignored and written by hand (see deploy/README.md):
#   deploy/.env   -> ECR_REGISTRY only (compose reads the .env next to this file)
#   backend/.env  -> the app's settings and secrets (env_file below)
# Postgres is Supabase, so nothing here stores trip data except Redis' queue.
name: afterframe

x-backend: &backend
  image: ${ECR_REGISTRY:?set ECR_REGISTRY in deploy/.env}/afterframe-backend:latest
  env_file: ../backend/.env
  restart: unless-stopped
  depends_on:
    redis:
      condition: service_healthy
  logging: &logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  web:
    <<: *backend
    command: >-
      gunicorn config.asgi:application -k uvicorn_worker.UvicornWorker
      -w 1 --timeout 120 -b 0.0.0.0:8000
    environment:
      # ASGI: Django advises no persistent DB connections.
      DB_CONN_MAX_AGE: "0"
      REDIS_URL: redis://redis:6379/0

  worker:
    <<: *backend
    command: celery -A config worker -c 2 --max-memory-per-child 300000 --loglevel INFO
    environment:
      DB_CONN_MAX_AGE: "60"
      REDIS_URL: redis://redis:6379/0

  beat:
    <<: *backend
    # Daily jobs: refresh_places (03:00 UTC) and db_keepalive (06:00 UTC).
    command: celery -A config beat --schedule /tmp/celerybeat-schedule --loglevel INFO
    environment:
      DB_CONN_MAX_AGE: "60"
      REDIS_URL: redis://redis:6379/0

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *logging

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
    restart: unless-stopped
    logging: *logging

volumes:
  redis-data:

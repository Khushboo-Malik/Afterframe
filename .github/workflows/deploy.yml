# Backend deploy: build the image, push it to ECR, roll it out on EC2 via SSM.
# Runs on GitHub's machines with a short-lived OIDC role. No AWS keys are stored
# anywhere, and nothing here ever runs on the laptop.
# Frontend-only commits never trigger this (Vercel deploys the frontend).
name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "deploy/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  id-token: write # lets the job ask GitHub for an OIDC token to assume the AWS role
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_REPO: ${{ secrets.ECR_REPO }}
      EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Django check
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ci-only-not-a-secret
        run: |
          uv sync --locked
          uv run python manage.py check

      - name: Assume the deploy role (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push afterframe-backend:<sha> and :latest
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ secrets.ECR_REPO }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ secrets.ECR_REPO }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Roll out on EC2 (SSM Run Command)
        run: |
          set -euo pipefail
          COMPOSE="docker compose -f deploy/docker-compose.prod.yml"
          PARAMS=$(jq -nc --arg c "$COMPOSE" '{
            commands: [
              "set -e",
              "cd /opt/afterframe",
              "git pull --ff-only",
              ($c + " pull"),
              ($c + " up -d --remove-orphans"),
              ($c + " exec -T web python manage.py migrate --noinput"),
              "docker image prune -f",
              ($c + " ps")
            ],
            executionTimeout: ["900"]
          }')
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "afterframe deploy ${GITHUB_SHA::7}" \
            --parameters "$PARAMS" \
            --query Command.CommandId --output text)
          echo "SSM command: $CMD_ID"

          # Poll up to ~15 minutes (the built-in waiter gives up after 100s).
          STATUS=Pending
          for _ in $(seq 1 90); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" \
              --instance-id "$EC2_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done

          echo "--- server output ---"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$EC2_INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text || true
          echo "Status: $STATUS"
          test "$STATUS" = Success
